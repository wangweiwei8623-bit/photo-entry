<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>报名照规格自查 · 入口</title>
<meta name="description" content="报名照被退回？免费自查本省规格，改不好的我人工帮你看。">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:#0f1115;color:#e8eaed;padding:24px;box-sizing:border-box}
  .box{max-width:420px;width:100%;text-align:center}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#9aa0a6;font-size:14px;margin:0 0 20px}
  a.btn{display:block;padding:14px 18px;border-radius:10px;background:#2f6bff;color:#fff;
        text-decoration:none;font-weight:600;margin-bottom:12px}
  a.btn:active{transform:scale(.99)}
  .tip{font-size:12px;color:#6b7280;margin-top:18px;word-break:break-all;line-height:1.8}
  .tip a{color:#8ab4f8;text-decoration:none}
  .ok{color:#34d399}
</style>
</head>
<body>
<div class="box">
  <h1>先看本省报名照规格</h1>
  <p>免费自查，改不好的我人工帮你看。</p>
  <a class="btn" id="go" href="#">进入规格自查 →</a>
  <div class="tip" id="fallback">正在连接…</div>
</div>
<script>
(function () {
  // 兜底地址：由 set-public-url.ps1 / sync-links.ps1 自动改写，别手改这一行格式
  var direct = 'https://add-households-advertisers-shelter.trycloudflare.com/photo/';

  var go = document.getElementById('go');
  var fb = document.getElementById('fallback');

  // 把入口页收到的 ?s=xxx 原样带到目标页，代理/渠道的来源才不会被吞掉
  function withSource(url) {
    var q = location.search;
    if (!q || q.length < 2) return url;
    var keep = q.slice(1).split('&').filter(function (kv) {
      return kv && kv.indexOf('t=') !== 0 && kv.indexOf('utm_') !== 0;
    });
    if (!keep.length) return url;
    return url + (url.indexOf('?') < 0 ? '?' : '&') + keep.join('&');
  }

  function paint(raw, ready) {
    var url = withSource(raw);
    go.href = url;
    fb.innerHTML = (ready ? '<span class="ok">已就绪</span><br>' : '') +
      '打不开就复制这个地址：<br><a href="' + url + '">' + url + '</a>';
  }

  // 1. 先用手上的地址立刻可点，不等网络
  if (direct) paint(direct, false);

  // 2. 再尝试拿最新地址覆盖；拿不到就保持兜底
  fetch('./target.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (j) {
      if (j && j.url) paint(j.url, true);
    })
    .catch(function () {
      if (!direct) {
        fb.innerHTML = '入口暂时不可用，稍后刷新本页重试。';
        go.href = '#';
      }
    });
})();
</script>
</body>
</html>
